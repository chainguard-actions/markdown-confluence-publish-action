name: Test oauth2 auth and optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: "https://example.atlassian.net"
          confluenceParentId: "123456"
          confluenceAuthType: "oauth2"
          atlassianClientId: "fake-client-id"
          atlassianClientSecret: "fake-client-secret"
          confluenceSiteUrl: "https://example.atlassian.net/wiki"
          contentRoot: "."
          configFile: ".markdownrc"
          confluenceApiPrefix: "/wiki/rest/api"
          confluenceRequestHeaders: '{"X-Custom-Header": "test-value"}'
          tagsToPublish: "publish,docs"
          mermaidProtocolTimeout: "30000"
          plantumlEnabled: "false"
          plantumlServerUrl: "https://www.plantuml.com/plantuml"

      - name: Assert action ran (failed gracefully with invalid oauth2 credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
