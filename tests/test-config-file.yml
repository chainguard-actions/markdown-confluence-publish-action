name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a config file and markdown content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/content"
          # Create a minimal config file
          cat > "$GITHUB_WORKSPACE/.markdown-confluence.json" << 'EOF'
          {
            "confluenceBaseUrl": "https://invalid-test-instance.atlassian.net/wiki",
            "confluenceParentId": "789012",
            "atlassianUserName": "test@example.com",
            "atlassianApiToken": "fake-api-token-for-testing",
            "folderToPublish": "content",
            "contentRoot": "."
          }
          EOF
          cat > "$GITHUB_WORKSPACE/content/sample.md" << 'EOF'
          ---
          connie-publish: true
          connie-title: Sample Page
          ---
          # Sample Page
          This is a sample page for testing.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://invalid-test-instance.atlassian.net/wiki'
          confluenceParentId: '789012'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token-for-testing'
          contentRoot: '.'
          configFile: '.markdown-confluence.json'

      - name: Assert action ran with config file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run (not skipped) — it may fail due to
          # invalid credentials, but it must not be 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — Docker container did not start"
            exit 1
          fi
          echo "PASS: action ran with configFile input (outcome=$OUTCOME)"
