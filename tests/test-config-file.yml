name: Test configFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file and markdown content
        run: |
          mkdir -p content
          cat > .markdown-confluence.json << 'EOF'
          {
            "confluenceBaseUrl": "https://example.atlassian.net/wiki",
            "confluenceParentId": "789012",
            "atlassianUserName": "test@example.com",
            "atlassianApiToken": "fake-api-token",
            "contentRoot": "content"
          }
          EOF
          cat > content/index.md << 'EOF'
          ---
          connie-publish: true
          connie-title: "Index Page"
          ---
          # Index
          Welcome to the documentation.
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://example.atlassian.net/wiki'
          confluenceParentId: '789012'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token'
          contentRoot: 'content'
          configFile: '.markdown-confluence.json'
      - name: Assert action was invoked with configFile
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be skipped) — it will fail due to fake credentials
          # but the Docker container should have been invoked.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with configFile (outcome: $OUTCOME)"
