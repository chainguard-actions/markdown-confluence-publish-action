name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file and sample content
        run: |
          mkdir -p docs
          cat > .markdown-confluence.json << 'EOF'
          {
            "confluenceBaseUrl": "https://example.atlassian.net/wiki",
            "confluenceParentId": "789012",
            "atlassianUserName": "test@example.com",
            "atlassianApiToken": "fake-api-token",
            "contentRoot": "docs"
          }
          EOF
          cat > docs/index.md << 'EOF'
          ---
          connie-publish: true
          connie-title: "Index Page"
          ---
          # Index
          Welcome to the documentation.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://example.atlassian.net/wiki'
          confluenceParentId: '789012'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token'
          contentRoot: 'docs'
          configFile: '.markdown-confluence.json'

      - name: Assert action ran with config file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (either succeeded or failed with a connection error)
          # It should NOT be 'skipped' which would indicate a setup problem
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
