name: Test folder publish input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample markdown files in folder
        run: |
          mkdir -p wiki/pages
          cat > wiki/pages/page1.md << 'EOF'
          # Page One
          Content for page one.
          EOF
          cat > wiki/pages/page2.md << 'EOF'
          # Page Two
          Content for page two.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://example.atlassian.net/wiki'
          confluenceParentId: '654321'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token'
          folderToPublish: 'wiki/pages'
          contentRoot: 'wiki'

      - name: Assert action ran with folder input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (either succeeded or failed with a connection error)
          # It should NOT be 'skipped' which would indicate a setup problem
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome: $OUTCOME"
