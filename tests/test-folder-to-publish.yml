name: Test folderToPublish input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown files in publish folder
        run: |
          mkdir -p wiki/pages
          cat > wiki/pages/page-one.md << 'EOF'
          # Page One
          Content for page one.
          EOF
          cat > wiki/pages/page-two.md << 'EOF'
          # Page Two
          Content for page two.
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://example.atlassian.net/wiki'
          confluenceParentId: '654321'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token'
          folderToPublish: 'wiki/pages'
          contentRoot: 'wiki'
      - name: Assert action was invoked with folderToPublish
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be skipped) — it will fail due to fake credentials
          # but the Docker container should have been invoked.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with folderToPublish (outcome: $OUTCOME)"
