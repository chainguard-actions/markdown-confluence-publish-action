name: Test folderToPublish input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create sample markdown files in a folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wiki"
          cat > "$GITHUB_WORKSPACE/wiki/page-one.md" << 'EOF'
          # Page One
          Content for page one.
          EOF
          cat > "$GITHUB_WORKSPACE/wiki/page-two.md" << 'EOF'
          # Page Two
          Content for page two.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://fake-instance.atlassian.net/wiki'
          confluenceParentId: '654321'
          atlassianUserName: 'fake-user@example.com'
          atlassianApiToken: 'fake-api-token'
          folderToPublish: 'wiki'
          contentRoot: '.'

      - name: Assert action ran (not skipped or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because credentials are invalid,
          # but it must have actually run (Docker container started).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — Docker container started successfully with folderToPublish input"
