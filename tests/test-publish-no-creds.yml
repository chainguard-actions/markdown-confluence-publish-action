name: Test publish command fails gracefully without credentials
on:
  workflow_dispatch:
jobs:
  test-publish-no-creds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample markdown file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cat > "$GITHUB_WORKSPACE/docs/sample.md" <<'EOF'
          ---
          connie-publish: true
          connie-title: "Sample Page"
          ---
          # Sample Page

          This is a sample markdown page.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: publish
          confluenceBaseUrl: "https://example.atlassian.net"
          confluenceParentId: "123456"
          atlassianUserName: "test@example.com"
          atlassianApiToken: "fake-token-for-testing"
          contentRoot: ${{ github.workspace }}
          folderToPublish: docs

      - name: Assert publish fails gracefully without real credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # publish requires real Confluence credentials; without them it should
          # fail (not succeed or be skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: publish unexpectedly succeeded (real credentials may be configured)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: publish failed gracefully as expected without real credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
