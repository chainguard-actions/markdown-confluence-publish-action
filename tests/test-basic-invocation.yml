name: Test basic invocation with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal markdown file for publishing
        run: |
          mkdir -p docs
          cat > docs/index.md << 'EOF'
          ---
          connie-publish: true
          connie-title: Test Page
          ---
          # Test Page
          This is a test page.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://invalid-test-instance.atlassian.net'
          confluenceParentId: '123456'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'invalid-token'
          folderToPublish: 'docs'
          contentRoot: '.'

      - name: Assert action ran (expected to fail with auth error, not crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (due to invalid credentials) but not be skipped
          # A 'failure' outcome means the Docker container ran and exited non-zero
          # which is the expected behavior when credentials are invalid
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to invalid credentials)"
