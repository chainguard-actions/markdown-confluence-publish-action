name: Test plan command fails gracefully without credentials
on:
  workflow_dispatch:
jobs:
  test-plan-no-creds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample markdown file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cat > "$GITHUB_WORKSPACE/docs/plan-sample.md" <<'EOF'
          ---
          connie-publish: true
          connie-title: "Plan Sample Page"
          ---
          # Plan Sample Page

          This is a sample markdown page for plan command testing.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: plan
          confluenceBaseUrl: "https://example.atlassian.net"
          confluenceParentId: "123456"
          atlassianUserName: "test@example.com"
          atlassianApiToken: "fake-token-for-testing"
          contentRoot: ${{ github.workspace }}
          folderToPublish: docs

      - name: Assert plan command ran (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # plan is a read-only Cloud discovery command; without real credentials
          # it should fail (not succeed or be skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: plan unexpectedly succeeded (real credentials may be configured)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: plan failed gracefully as expected without real credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
