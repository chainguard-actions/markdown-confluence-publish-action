name: Test invalid command exits with error
on:
  workflow_dispatch:
jobs:
  test-invalid-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: invalid-command
          contentRoot: ${{ github.workspace }}

      - name: Assert invalid command causes failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint.sh exits with code 2 for unknown commands.
          # The action step should therefore fail, not succeed or be skipped.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: invalid command caused expected failure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: invalid command should not succeed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
