name: Test invalid credentials handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action will fail because credentials are invalid — that is expected.
    # We use continue-on-error so we can assert on the outcome.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal markdown file to publish
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cat > "$GITHUB_WORKSPACE/docs/test-page.md" << 'EOF'
          ---
          connie-publish: true
          connie-title: Test Page
          ---
          # Test Page
          This is a test page.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://invalid-test-instance.atlassian.net/wiki'
          confluenceParentId: '123456'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token-for-testing'
          folderToPublish: 'docs'
          contentRoot: '.'

      - name: Assert action ran (Docker container started)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run (not skipped) — it may fail due to
          # invalid credentials, but it must not be 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — Docker container did not start"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to invalid credentials)"
