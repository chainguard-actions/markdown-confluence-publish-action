name: Test invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a sample markdown file to publish
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cat > "$GITHUB_WORKSPACE/docs/test-page.md" << 'EOF'
          ---
          connie-publish: true
          connie-title: "Test Page"
          ---
          # Test Page
          This is a test page.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://fake-instance.atlassian.net/wiki'
          confluenceParentId: '123456'
          atlassianUserName: 'fake-user@example.com'
          atlassianApiToken: 'fake-api-token'
          contentRoot: 'docs'

      - name: Assert action failed due to invalid credentials (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because credentials are invalid,
          # not because of a Docker/setup issue. Either 'failure' or 'success'
          # is acceptable here — what matters is the action ran (not skipped/cancelled).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — Docker container started successfully"
