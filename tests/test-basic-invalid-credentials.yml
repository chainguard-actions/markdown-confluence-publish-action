name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: https://invalid-confluence-instance.example.com
          confluenceParentId: "123456"
          atlassianUserName: test-user@example.com
          atlassianApiToken: invalid-api-token
          folderToPublish: docs
          contentRoot: ${{ github.workspace }}

      - name: Assert action failed due to invalid credentials (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
