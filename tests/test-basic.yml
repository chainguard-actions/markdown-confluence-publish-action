name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sample markdown file
        run: |
          mkdir -p docs
          cat > docs/sample.md << 'EOF'
          ---
          connie-publish: true
          connie-title: "Test Page"
          ---
          # Test Page
          This is a test page.
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          confluenceBaseUrl: 'https://example.atlassian.net/wiki'
          confluenceParentId: '123456'
          atlassianUserName: 'test@example.com'
          atlassianApiToken: 'fake-api-token'
          contentRoot: 'docs'
      - name: Assert action was invoked (Docker container ran)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with a Confluence API error,
          # not with a Docker infrastructure error (which would be 'skipped').
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: $OUTCOME)"
